name: Frozen shadow protocol CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate frozen baseline snapshot
        run: |
          python scripts/run_shadow.py ingest \
            --snapshot incoming/baseline_2026-07-31.json \
            --ledger /tmp/coreno_shadow_ledger.csv
          python scripts/run_shadow.py evaluate \
            --ledger /tmp/coreno_shadow_ledger.csv
