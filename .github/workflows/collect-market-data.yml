name: Collect forward market data

on:
  schedule:
    - cron: "20 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forward-market-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install collector dependency
        run: python -m pip install --disable-pip-version-check "yfinance>=0.2.54,<1"
      - name: Collect raw closes
        run: python scripts/collect_market_data.py --output data/raw/market_close.csv --lookback-days 14
      - name: Commit new observations
        run: |
          if git diff --quiet -- data/raw/market_close.csv; then
            echo "No new market observations."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/market_close.csv
          git commit -m "data: append forward market observations"
          git push
